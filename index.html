:root {
  --canvas: oklch(98.2% 0.001 90);
  --canvas-raised: oklch(100% 0 0);
  --ink: oklch(16% 0.003 90);
  --ink-dim: oklch(46% 0.004 90);
  --ink-faint: oklch(64% 0.004 90);
  --line: oklch(90% 0.003 90);
  --line-strong: oklch(80% 0.004 90);

  --canvas-dark: oklch(13% 0.004 90);
  --ink-on-dark: oklch(97% 0.002 90);
  --ink-dim-on-dark: oklch(70% 0.006 90);
  --line-on-dark: oklch(28% 0.006 90);

  --warn: oklch(62% 0.14 55);
  --danger-ink: oklch(50% 0.01 90);

  --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --radius: 14px;
  --radius-sm: 8px;
  --radius-pill: 999px;

  --shadow-card: 0 1px 2px oklch(16% 0.003 90 / 0.04), 0 8px 24px oklch(16% 0.003 90 / 0.06);
  --shadow-sheet: 0 -8px 40px oklch(16% 0.003 90 / 0.12);

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

  --container: 1280px;
  --gutter: 20px;

  color-scheme: light;
}

@media (min-width: 768px) {
  :root { --gutter: 32px; }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }

::selection { background: var(--ink); color: var(--canvas); }
::-moz-selection { background: var(--ink); color: var(--canvas); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: var(--radius-pill); border: 2px solid var(--canvas); }
* { scrollbar-color: var(--line-strong) transparent; scrollbar-width: thin; }

:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  caret-color: var(--ink);
}

img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; }
a { color: inherit; }

.tabular { font-variant-numeric: tabular-nums; }

.price {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
  letter-spacing: -0.02em;
}

/* ---------- layout shell ---------- */

.shell {
  max-width: var(--container);
  margin: 0 auto;
  padding-left: var(--gutter);
  padding-right: var(--gutter);
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in oklch, var(--canvas) 92%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

.site-header__inner {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding-top: 18px;
  padding-bottom: 18px;
}

.brand {
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0;
}

.stamp {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.75rem;
  color: var(--ink-faint);
  letter-spacing: -0.01em;
  white-space: nowrap;
}

/* ---------- hero / intro ---------- */

.intro {
  padding-top: 36px;
  padding-bottom: 24px;
}

.intro h1 {
  font-size: clamp(2rem, 4.6vw, 3rem);
  line-height: 1.05;
  letter-spacing: -0.03em;
  margin: 0 0 10px;
  max-width: 16ch;
}

.intro p {
  margin: 0;
  color: var(--ink-dim);
  font-size: 1rem;
  max-width: 46ch;
}

/* ---------- search ---------- */

.search-bar {
  padding-bottom: 16px;
}

.search-field {
  position: relative;
  display: flex;
  align-items: center;
}

.search-field svg {
  position: absolute;
  left: 16px;
  width: 18px;
  height: 18px;
  color: var(--ink-faint);
  pointer-events: none;
}

.search-field input {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--canvas-raised);
  border-radius: var(--radius);
  padding: 13px 16px 13px 44px;
  font-size: 0.95rem;
  color: var(--ink);

  var visibleCategories = categoriesDoc.categories.filter(function (cat) {
    return catalog.products.some(function (p) {
      return p.category === cat.id && presentVariants(p).length > 0;
    });
  });

  if (visibleCategories.length) state.category = visibleCategories[0].id;

  // ---------- DOM refs ----------

  var els = {
    tabs: document.getElementById("tabs"),
    grid: document.getElementById("grid"),
    empty: document.getElementById("empty"),
    search: document.getElementById("search"),
    searchClear: document.getElementById("search-clear"),
    priceDrops: document.getElementById("price-drops"),
    dropsList: document.getElementById("drops-list"),
    sheet: document.getElementById("sheet"),
    sheetBackdrop: document.getElementById("sheet-backdrop"),
    sheetClose: document.getElementById("sheet-close"),
    sheetMedia: document.getElementById("sheet-media"),
    sheetTitle: document.getElementById("sheet-title"),
    sheetCondition: document.getElementById("sheet-condition"),
    sheetAxes: document.getElementById("sheet-axes"),
    sheetPrice: document.getElementById("sheet-price"),
    sheetStatus: document.getElementById("sheet-status"),
    sheetCta: document.getElementById("sheet-cta")
  };

  // ---------- tabs ----------

  function renderTabs() {
    els.tabs.innerHTML = "";
    visibleCategories.forEach(function (cat) {
      var count = catalog.products.filter(function (p) {
        return p.category === cat.id && presentVariants(p).length > 0;
      }).length;

      var btn = document.createElement("button");
      btn.className = "tab";
      btn.type = "button";
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", String(state.category === cat.id));
      btn.innerHTML = cat.label + ' <span class="tab-count">' + count + "</span>";
      btn.addEventListener("click", function () {
        state.category = cat.id;
        if (state.query) {
          state.query = "";
          els.search.value = "";
          els.searchClear.hidden = true;
        }
        render();
      });
      els.tabs.appendChild(btn);
    });
  }

  // ---------- grid ----------

  function productsForView() {
    var tokens = normalize(state.query).split(/\s+/).filter(Boolean);
    if (tokens.length) {
      return catalog.products.filter(function (p) {
        return presentVariants(p).length > 0 && matchesQuery(p, tokens);
      });
    }
    return catalog.products.filter(function (p) {
      return p.category === state.category && presentVariants(p).length > 0;
    });
  }

  function renderCard(product) {
    var variants = presentVariants(product);
    var cat = categoriesById[product.category];
    var summary = variantSummaryPrice(variants);

    var card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.setAttribute("data-unavailable", String(summary.kind === "unavailable"));

    var mediaHtml = product.image
      ? '<img src="' + product.image + '" alt="" loading="lazy">'
      : silhouette(product.category);

    var metaHtml = variants.length === 1
      ? axisText(product, variants[0])
      : variants.length + " opciones";

    var bottomHtml = "";
    if (summary.kind === "priced") {
      bottomHtml =
        '<div class="card-price"><span class="from">desde</span>' + formatPrice(summary.price) + "</div>" +
        '<div class="card-status" data-state="' + summary.state + '">' +
        (summary.state === "low" ? "Pocas unidades" : "Disponible") + "</div>";
    } else if (summary.kind === "inquire") {
      bottomHtml = '<div class="card-status" data-state="inquire">Consultar precio</div>';
    } else {
      bottomHtml = '<div class="card-status" data-state="unavailable">Sin stock</div>';
    }

    if (state.query) {
      metaHtml = cat.label + " · " + metaHtml;
    }

    card.innerHTML =
      '<div class="card-media">' + mediaHtml + "</div>" +
      '<h3 class="card-name">' + product.name + "</h3>" +
      '<p class="card-meta">' + metaHtml + "</p>" +
      '<div class="card-bottom">' + bottomHtml + "</div>";

    card.addEventListener("click", function () { openSheet(product); });
    return card;
  }

  function renderGrid() {
    var list = productsForView();
    els.grid.innerHTML = "";

    if (!list.length) {
      els.empty.hidden = false;
      els.grid.hidden = true;
      return;
    }

    els.empty.hidden = true;
    els.grid.hidden = false;

    // orden: los que tienen precio o consultan primero, sin stock al final.
    list = list.slice().sort(function (a, b) {
      var sa = variantSummaryPrice(presentVariants(a)).kind === "unavailable" ? 1 : 0;
      var sb = variantSummaryPrice(presentVariants(b)).kind === "unavailable" ? 1 : 0;
      return sa - sb;
    });

    list.forEach(function (p) { els.grid.appendChild(renderCard(p)); });
  }

  document.getElementById("empty-reset").addEventListener("click", function () {
    state.query = "";
    els.search.value = "";
    els.searchClear.hidden = true;
    render();
  });

  // ---------- price drops (único momento oscuro) ----------

  function renderPriceDrops() {
    if (!priceDrops.length) {
      els.priceDrops.hidden = true;
      return;
    }
    els.priceDrops.hidden = false;
    els.dropsList.innerHTML = "";
    priceDrops.forEach(function (d) {
      var row = document.createElement("div");
      row.className = "drop-row";
      row.innerHTML =
        '<div><div class="drop-name">' + d.name + '</div><div class="drop-meta">' + d.axis_summary + "</div></div>" +
        '<div class="drop-prices"><span class="old">' + formatPrice(d.old_price) + '</span><span class="new">' + formatPrice(d.new_price) + "</span></div>";
      els.dropsList.appendChild(row);
    });
  }

  // ---------- sheet ----------

  var sheetState = { product: null, selection: {}, trigger: null };

  function openSheet(product) {
    sheetState.product = product;
    sheetState.trigger = document.activeElement;
    var cat = categoriesById[product.category];
    var variants = presentVariants(product);
    var firstAvailable = variants.find(function (v) { return v.stock !== "unavailable"; }) || variants[0];
    sheetState.selection = {};
    cat.variant_axes.forEach(function (axis) { sheetState.selection[axis] = firstAvailable[axis]; });

    els.sheetTitle.textContent = product.name;
    els.sheetCondition.hidden = !product.condition;
    if (product.condition) els.sheetCondition.textContent = product.condition;

    els.sheetMedia.innerHTML = product.image
      ? '<img src="' + product.image + '" alt="' + product.name + '">'
      : silhouette(product.category);

    renderSheetAxes();
    updateSheetSelection();

    document.body.style.overflow = "hidden";
    els.sheetBackdrop.hidden = false;
    els.sheet.hidden = false;
    requestAnimationFrame(function () {
      els.sheetBackdrop.setAttribute("data-open", "true");
      els.sheet.setAttribute("data-open", "true");
    });
    els.sheet.setAttribute("aria-hidden", "false");
    els.sheetClose.focus();
  }

  function closeSheet() {
    els.sheetBackdrop.removeAttribute("data-open");
    els.sheet.removeAttribute("data-open");
    els.sheet.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    setTimeout(function () {
      els.sheetBackdrop.hidden = true;
      els.sheet.hidden = true;
    }, 320);
    if (sheetState.trigger && sheetState.trigger.focus) sheetState.trigger.focus();
  }

  function currentVariant() {
    var product = sheetState.product;
    return product.variants.find(function (v) {
      return categoriesById[product.category].variant_axes.every(function (axis) {
        return v[axis] === sheetState.selection[axis];
      });
    });
  }

  function renderSheetAxes() {
    var product = sheetState.product;
    var cat = categoriesById[product.category];
    els.sheetAxes.innerHTML = "";

    cat.variant_axes.forEach(function (axis) {
      var values = [];
      product.variants.forEach(function (v) {
        if (v.present === false) return;
        if (values.indexOf(v[axis]) === -1) values.push(v[axis]);
      });
      if (values.length <= 1 && cat.variant_axes.length > 1) {
        // eje sin alternativas: no vale la pena un selector para una sola opción,
        // salvo que sea el único eje del producto.
      }

      var block = document.createElement("div");
      block.className = "sheet-axis";
      var label = document.createElement("p");
      label.className = "sheet-axis-label";
      label.textContent = axisLabels[axis] || axis;
      block.appendChild(label);

      var row = document.createElement("div");
      row.className = "chip-row";

      values.forEach(function (value) {
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.textContent = value;

        var otherAxesMatch = product.variants.some(function (v) {
          if (v.present === false) return false;
          if (v[axis] !== value) return false;
          return cat.variant_axes.every(function (a) {
            return a === axis || v[a] === sheetState.selection[a];
          });
        });
        var stillExists = product.variants.some(function (v) {
          return v.present !== false && v[axis] === value;
        });

        chip.setAttribute("aria-pressed", String(sheetState.selection[axis] === value));
        if (!stillExists) chip.disabled = true;

        chip.addEventListener("click", function () {
          sheetState.selection[axis] = value;
          // si la combinación resultante no existe, ajustamos los otros ejes al primer match posible
          if (!currentVariant()) {
            var candidate = product.variants.find(function (v) {
              return v.present !== false && v[axis] === value;
            });
            if (candidate) {
              cat.variant_axes.forEach(function (a) { sheetState.selection[a] = candidate[a]; });
            }
          }
          renderSheetAxes();
          updateSheetSelection();
        });

        row.appendChild(chip);
      });

      block.appendChild(row);
      els.sheetAxes.appendChild(block);
    });
  }

  function updateSheetSelection() {
    var product = sheetState.product;
    var variant = currentVariant();
    if (!variant) return;

    if (variant.price != null && variant.stock !== "unavailable") {
      els.sheetPrice.textContent = formatPrice(variant.price);
      els.sheetPrice.hidden = false;
      els.sheetStatus.hidden = false;
      els.sheetStatus.setAttribute("data-state", variant.stock);
      els.sheetStatus.textContent = variant.stock === "low" ? "Pocas unidades" : "Disponible";
    } else if (variant.stock === "unavailable") {
      els.sheetPrice.hidden = true;
      els.sheetStatus.hidden = false;
      els.sheetStatus.setAttribute("data-state", "unavailable");
      els.sheetStatus.textContent = "Sin stock";
    } else {
      els.sheetPrice.hidden = true;
      els.sheetStatus.hidden = false;
      els.sheetStatus.removeAttribute("data-state");
      els.sheetStatus.textContent = "Consultar precio";
    }

    var unavailable = variant.stock === "unavailable";
    els.sheetCta.setAttribute("aria-disabled", String(unavailable));
    if (unavailable) {
      els.sheetCta.removeAttribute("href");
    } else {
      els.sheetCta.href = buildContactLink(product, variant);
    }
  }

  function buildContactLink(product, variant) {
    var contact = config.contact || {};
    var name = variantFullName(product, variant);
    var template = variant.price != null
      ? (contact.message_template || "Hola! Quería consultar por el {product} que figura a {price}.")
      : (contact.message_template_no_price || "Hola! Quería consultar por el {product}. ¿Tienen precio?");
    var message = template
      .replace("{product}", name)
      .replace("{price}", variant.price != null ? formatPrice(variant.price) : "");

    if (contact.channel === "instagram" && contact.instagram) {
      return "https://ig.me/m/" + contact.instagram;
    }
    var phone = (contact.whatsapp || "").replace(/[^0-9]/g, "");
    return "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
  }

  els.sheetClose.addEventListener("click", closeSheet);
  els.sheetBackdrop.addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && els.sheet.getAttribute("aria-hidden") === "false") closeSheet();
  });

  // ---------- search ----------

  var searchDebounce;
  els.search.addEventListener("input", function () {
    clearTimeout(searchDebounce);
    var value = els.search.value;
    els.searchClear.hidden = !value;
    searchDebounce = setTimeout(function () {
      state.query = value;
      render();
    }, 120);
  });

  els.searchClear.addEventListener("click", function () {
    els.search.value = "";
    els.searchClear.hidden = true;
    state.query = "";
    els.search.focus();
    render();
  });

  // ---------- render ----------

  function render() {
    renderTabs();
    renderGrid();
  }

  renderPriceDrops();
  render();
})();

</script>
</body>
</html>
